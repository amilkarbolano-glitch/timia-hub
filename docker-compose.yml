# Timia Hub — despliegue completo: web (nginx + front) · api (FastAPI) · mongo
#   docker compose up -d --build
#   http://localhost  (o la IP/DNS del servidor)
services:
  mongo:
    image: mongo:7
    container_name: timia-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Puerto expuesto solo para administración local; en AWS quítalo o restringe por Security Group
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: timia-api
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-timia}
      TIMIA_API_KEY: ${TIMIA_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SEED_ON_START: "true"
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "8000"
    # Descomenta para acceder a la API directamente (docs en /docs)
    # ports:
    #   - "8000:8000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: timia-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  mongo_data:
