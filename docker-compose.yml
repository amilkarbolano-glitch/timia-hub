# Timia Hub — despliegue completo en una máquina: web (nginx + front) · api · mongo
# Requiere el repo del backend clonado al lado:  ../timia-hub-api
#   git clone https://github.com/amilkarbolano-glitch/timia-hub-api ../timia-hub-api
#   cp .env.example .env && docker compose up -d --build   → http://localhost
services:
  mongo:
    image: mongo:7
    container_name: timia-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Puerto expuesto solo para administración local; en AWS quítalo o restringe por Security Group
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ${API_SRC:-../timia-hub-api}
    image: timia-hub-api:latest
    container_name: timia-api
    restart: unless-stopped
    env_file: .env                      # mismas variables que timia-hub-api/.env.example
    environment:
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "8000"
    # Descomenta para acceder a la API directamente (docs en /docs)
    # ports:
    #   - "8000:8000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: timia-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  mongo_data:
