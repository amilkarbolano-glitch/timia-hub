name: CI/CD — Timia Hub

# main → Amplify (producción, DevOps). GitHub Pages = ambiente de pruebas: publica develop
# en cada push, o cualquier rama a mano (Actions → Run workflow → elegir rama).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Permisos para GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ─── BUILD ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Build frontend
        run: |
          npm run build:client
          echo "window.TIMIA_BUILD = { branch: '${GITHUB_REF_NAME}', sha: '${GITHUB_SHA::7}', at: '$(date -u +%Y-%m-%dT%H:%MZ)' };" >> dist/config.js
        env:
          GITHUB_PAGES: 'true'
          VITE_API_URL: ${{ secrets.VITE_API_URL || '' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # ─── DOCKER: valida que las imágenes construyen (no publica) ──────────────
  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -t timia-web:ci .

  # ─── DEPLOY a GitHub Pages (solo en push a main) ──────────────────────────
  deploy:
    name: Deploy → GitHub Pages
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
