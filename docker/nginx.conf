server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API → backend FastAPI (mismo origen, sin CORS)
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    client_max_body_size 20m;
  }

  # SPA: cualquier ruta → index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # config.js y db.json nunca en caché (se pueden cambiar sin recompilar)
  location = /config.js { add_header Cache-Control "no-store"; }
  location = /db.json   { add_header Cache-Control "no-store"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  gzip on; gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
